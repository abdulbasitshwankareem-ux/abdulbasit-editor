
name: Build Abdulbasit Editor APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "manifest.json"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f manifest.json ]; then
            cp manifest.json www/manifest.json
          fi
          cat > package.json <<'EOF'
          {
            "name": "abdulbasit-editor",
            "version": "1.0.0",
            "private": true,
            "description": "Abdulbasit Editor Android app",
            "scripts": {
              "build": "echo Web app ready"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.abdulbasit.editor",
            "appName": "abdulbasit editor",
            "webDir": "www"
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abdulbasit-editor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
