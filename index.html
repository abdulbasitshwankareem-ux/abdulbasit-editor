<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdulbasit Editor – ئەپی دیزاین و دەستکاری</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7928ca">
    <style>
        :root {
            --bg: #070709;
            --card-bg: #121218;
            --card-border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --muted: #9494a0;
            --primary-purple: #7928ca;
            --primary-blue: #0070f3;
            --primary-pink: #eb367f;
            --accent-gold: #f5a623;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }
        header {
            text-align: center;
            padding: 24px 0;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 24px;
        }
        header h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        header p {
            color: var(--muted);
            font-size: 0.9rem;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }
        .upload-section {
            text-align: center;
            border: 2px dashed rgba(121, 40, 202, 0.4);
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-section:hover {
            border-color: var(--primary-purple);
            background-color: rgba(121, 40, 202, 0.05);
        }
        .upload-section input {
            display: none;
        }
        .upload-btn {
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-blue));
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            display: inline-block;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 16px;
        }
        .tool-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            color: var(--text);
            padding: 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .tool-btn:hover {
            background: rgba(121, 40, 202, 0.15);
            border-color: var(--primary-purple);
        }
        #previewContainer {
            margin-top: 16px;
            text-align: center;
        }
        #previewContainer img, #previewContainer video {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            margin-top: 10px;
        }
        footer {
            text-align: center;
            padding: 20px 0;
            color: var(--muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--card-border);
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Abdulbasit Editor</h1>
        <p>ئەپی زیرەکی دەستکاری وێنە و ڤیدیۆ بە AI</p>
    </header>

    <div class="container">
        <div class="card">
            <div class="upload-section" onclick="document.getElementById('mediaInput').click()">
                <p>📷 وێنە یان ڤیدیۆ لێرە باربکە بۆ دەستکاری</p>
                <button class="upload-btn">هەڵبژاردنی فایل</button>
                <input type="file" id="mediaInput" accept="image/*,video/*">
            </div>
            <div id="previewContainer"></div>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 12px; font-size: 1rem;">ئامرازە زیرەکەکان (AI Tools)</h3>
            <div class="tools-grid">
                <button class="tool-btn" onclick="triggerAction('باشترکردنی کوالێتی AI')">✨ باشترکردنی کوالێتی</button>
                <button class="tool-btn" onclick="triggerAction('لابردنی پاشبنەما')">🖼️ لابردنی پاشبنەما</button>
                <button class="tool-btn" onclick="triggerAction('فلتەری ڕەنگاوڕەنگ')">🎨 فلتەری پڕۆفیشناڵ</button>
                <button class="tool-btn" onclick="triggerAction('مۆنتاری خێرای AI')">⚡ مۆنتاری خێرا</button>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 Abdulbasit Shwan Kareem. All rights reserved.</p>
    </footer>

    <script>
        const mediaInput = document.getElementById('mediaInput');
        const previewContainer = document.getElementById('previewContainer');

        mediaInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            previewContainer.innerHTML = '';
            const fileURL = URL.createObjectURL(file);

            if (file.type.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = fileURL;
                previewContainer.appendChild(img);
            } else if (file.type.startsWith('video/')) {
                const video = document.createElement('video');
                video.src = fileURL;
                video.controls = true;
                previewContainer.appendChild(video);
            }
        });

        function triggerAction(name) {
            alert('ئامرازی (' + name + ') بە سەرکەوتوویی چالاک کرا!');
        }
    </script>
</body>
</html>
